<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Quest - Retro MMO RPG</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-container">
      <div id="login-screen">
        <div class="login-container">
          <h1>Pixel Quest</h1>
          <p>A Retro MMO RPG Adventure</p>
          <input type="text" id="username-input" placeholder="Enter your username" maxlength="16">
          <button id="start-game-btn">Enter World</button>
        </div>
      </div>
      <div id="game-ui" class="hidden">
        <div id="player-stats">
          <div id="health-bar">
            <div id="health-fill"></div>
          </div>
          <div id="player-level">LVL 1</div>
        </div>
        <div id="chat-container">
          <div id="chat-messages"></div>
          <input type="text" id="chat-input" placeholder="Type a message..." maxlength="100">
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
